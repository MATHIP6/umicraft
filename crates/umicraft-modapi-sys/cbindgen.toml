# cbindgen configuration for include/umicraft.h (ADR-0087).
# cbindgen is an external tool (MPL-2.0), run by tools/gen-header.sh.
language = "C"
include_guard = "UMICRAFT_H"
usize_is_size_t = true
no_includes = false
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
header = "/* Generated by cbindgen from umicraft-modapi-sys. Do not edit; run tools/gen-header.sh. */"
style = "both"

[export]
prefix = ""
# The crate declares types only, no `extern "C"` function, so cbindgen would emit
# nothing but constants: every ABI type is listed here.
include = [
    "UmiButtonPressed",
    "UmiBytes",
    "UmiCameraCx",
    "UmiCameraFn",
    "UmiCameraInput",
    "UmiChatReceived",
    "UmiChatSend",
    "UmiCommandFn",
    "UmiConnected",
    "UmiDisconnected",
    "UmiEffect",
    "UmiEntity",
    "UmiEntityVisitFn",
    "UmiEventHeader",
    "UmiEventId",
    "UmiFrame",
    "UmiHandlerFn",
    "UmiHost",
    "UmiHudCx",
    "UmiHudDrawFn",
    "UmiHudPlacement",
    "UmiKeyPressed",
    "UmiLevel",
    "UmiModApiVersionFn",
    "UmiModContext",
    "UmiMode",
    "UmiModHandle",
    "UmiModInitFn",
    "UmiModShutdownFn",
    "UmiModuleDef",
    "UmiModuleToggled",
    "UmiPacket",
    "UmiPhysicsCx",
    "UmiPhysicsFn",
    "UmiPhysicsInput",
    "UmiPlayerPhysics",
    "UmiPostTick",
    "UmiPreRender",
    "UmiPreTick",
    "UmiRenderCamera",
    "UmiScreen",
    "UmiServiceMode",
    "UmiSettingDef",
    "UmiSettingKind",
    "UmiSettingValue",
    "UmiStatus",
    "UmiStr",
    "UmiVersion",
    "UmiWorldCx",
    "UmiWorldDrawFn",
]

[export.rename]

[parse]
parse_deps = false
