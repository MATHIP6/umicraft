[package]
name = "umicraft-core"
description = "Umicraft core runtime: modules, services, events, tick scheduler, configuration."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
puffin = { version = "0.20", optional = true }
puffin_http = { version = "0.17", optional = true }

[features]
# CPU spans for the puffin viewer (ADR-0059). Off by default: the macros expand to nothing.
profiling = ["dep:puffin", "dep:puffin_http"]

[lints]
workspace = true
