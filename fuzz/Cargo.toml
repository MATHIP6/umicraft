[package]
name = "umicraft-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
umicraft-net = { path = "../crates/umicraft-net" }
umicraft-protocol = { path = "../crates/umicraft-protocol" }
umicraft-world = { path = "../crates/umicraft-world" }

# Not part of the main workspace: fuzzing needs nightly.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "play_clientbound"
path = "fuzz_targets/play_clientbound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "play_serverbound"
path = "fuzz_targets/play_serverbound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "play_session"
path = "fuzz_targets/play_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk_parser"
path = "fuzz_targets/chunk_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false
