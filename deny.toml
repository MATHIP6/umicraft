# cargo-deny config (spec §3.7, §11): every dependency license must be project-compatible.

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib",
    # Boost: permissive and OSI-approved. clipboard-win and error-code, which
    # arboard (the text-field clipboard) uses on Windows, carry it.
    "BSL-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
