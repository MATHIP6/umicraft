[mod]
id = "physics_tweak"
name = "Physics tweak"
version = "0.1.0"
authors = ["Umicraft contributors"]
api_version = "1.1"
license = "MIT"
description = "Teaching example: wraps the player's physics step only to measure your speed and last jump height (it changes nothing), and reads the block under you and the nearest player with the world queries."
library = "physics_tweak"

[permissions]
movement = true

[load]
wraps = ["player_physics"]
