# The manifest the client reads before it loads your library. The folder this
# file sits in must be named exactly like `id` below.
[mod]
# Unique name of the mod: a lowercase letter, then lowercase letters, digits
# or `_`, at most 64 characters.
id = "my_mod"
# The name players see in the mods menu. Must not be empty.
name = "My mod"
# Your mod's own version, in semantic versioning (major.minor.patch).
version = "0.1.0"
# Who wrote it, as plain names.
authors = ["Your name"]
# The mod API this library was built for. A client of the same major and an
# equal or newer minor loads it: "1.0" loads on a 1.0, 1.1 or 1.2 client, not on
# a 2.0 client or on a 1.0 client when you wrote "1.1".
api_version = "1.4"
# Optional: an SPDX license expression.
license = "MIT"
# Optional: one line shown in the mods menu.
description = "A minimal mod to copy: one setting, one tick observer, a shutdown message."
# Optional: the library file name without `lib` or the extension. It defaults
# to the id; letters, digits, `_` and `-` only. Must match `[lib] name`.
library = "my_mod"

# Other mods this one needs, as `id = "version requirement"`. A missing or
# wrongly versioned dependency keeps this mod from loading. The default is none.
# [dependencies]
# other_mod = ">=0.2, <1.0"

[load]
# Lower loads earlier, among mods with no dependency between them. Default 0.
priority = 0
# Services this mod replaces entirely; at most one mod may replace each.
# Default: none. The services are "player_physics" (needs `movement`) and
# "render_camera" (needs `camera`).
replaces = []
# Services this mod wraps; any number of mods may. Default: none.
wraps = []

[permissions]
# What the mod asks for. The client shows these; the packet and movement
# ones are also checked by the host. All default to false.
# Read or inject network packets (and subscribe to packet events).
network_packets = false
# Wrap or replace the player's movement (`player_physics`).
movement = false
# Wrap or replace the render camera (`render_camera`). Changes only what is drawn.
camera = false
# Shown to the player as "uses files". Not enforced: native code can open files anyway.
filesystem = false
# Shown to the player as "uses http". Not enforced.
network_http = false
