[workspace]
resolver = "2"
members = ["crates/umicraft-core", "crates/umicraft-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Umicraft contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aes = "0.8"
flate2 = "1.0"
num-bigint = "0.4"
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
