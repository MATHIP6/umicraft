[workspace]
resolver = "2"
members = ["crates/umicraft-core", "crates/umicraft-protocol", "crates/umicraft-net", "crates/umicraft-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Umicraft contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aes = "0.8"
flate2 = "1.0"
num-bigint = "0.4"
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "tracing-log"] }
umicraft-net = { path = "crates/umicraft-net", version = "0.1.0" }
umicraft-protocol = { path = "crates/umicraft-protocol", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
