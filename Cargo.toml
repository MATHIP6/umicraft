[workspace]
resolver = "2"
members = ["crates/umicraft-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Umicraft contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
