[workspace]
resolver = "2"
members = [
    "crates/umicraft-core",
    "crates/umicraft-protocol",
    "crates/umicraft-world",
    "crates/umicraft-model",
    "crates/umicraft-mesh",
    "crates/umicraft-render",
    "crates/umicraft-client",
    "crates/umicraft-net",
    "crates/umicraft-testkit",
    "crates/umicraft-assets",
    "crates/umicraft-game",
    "crates/umicraft-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Umicraft contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aes = "0.8"
bytemuck = { version = "1", features = ["derive"] }
flate2 = "1.0"
num-bigint = "0.4"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "tracing-log"] }
umicraft-assets = { path = "crates/umicraft-assets", version = "0.1.0" }
umicraft-model = { path = "crates/umicraft-model", version = "0.1.0" }
umicraft-net = { path = "crates/umicraft-net", version = "0.1.0" }
umicraft-protocol = { path = "crates/umicraft-protocol", version = "0.1.0" }
umicraft-world = { path = "crates/umicraft-world", version = "0.1.0" }
umicraft-mesh = { path = "crates/umicraft-mesh", version = "0.1.0" }
umicraft-render = { path = "crates/umicraft-render", version = "0.1.0" }
umicraft-game = { path = "crates/umicraft-game", version = "0.1.0" }
umicraft-ui = { path = "crates/umicraft-ui", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
chunks_exact_to_as_chunks = "allow"
